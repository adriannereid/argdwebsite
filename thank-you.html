<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You | Adrianne Reid Garden Design</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://www.adriannereid.co.nz/" />

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --sage: #d0d5b8;
      --brown: #7a4e1c;
      --brown-dark: #56380c;
      --dark: #2c2416;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Jost', sans-serif; font-weight: 300; background: var(--sage); color: var(--dark); min-height: 100vh; display: flex; flex-direction: column; }

    nav {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.2rem 5vw;
      background: var(--sage);
      border-bottom: 1px solid rgba(86,56,12,0.2);
    }
    .nav-logo { display: flex; flex-direction: column; align-items: center; line-height: 1; text-decoration: none; }
    .nav-logo-mark { font-family: 'Playfair Display', serif; font-size: 1.55rem; color: var(--brown); line-height: 1; }
    .nav-logo-name { font-family: 'Playfair Display', serif; font-size: 0.72rem; color: var(--brown); letter-spacing: 0.04em; margin-top: 0.05em; }
    .nav-logo-sub { font-family: 'Jost', sans-serif; font-size: 0.44rem; font-weight: 400; letter-spacing: 0.32em; text-transform: uppercase; color: var(--brown-dark); margin-top: 0.15em; }

    .thank-you {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 6rem 5vw;
    }
    .thank-you-monogram {
      font-family: 'Playfair Display', serif;
      font-size: clamp(4rem,12vw,8rem);
      color: var(--brown); line-height: 1;
      margin-bottom: 2rem;
    }
    .thank-you-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.8rem,3.5vw,2.6rem);
      font-weight: 400; color: var(--brown);
      line-height: 1.25; margin-bottom: 1.5rem;
    }
    .thank-you-text {
      font-size: 0.97rem; line-height: 1.9;
      color: var(--dark); opacity: 0.8;
      max-width: 44ch; margin: 0 auto 2.5rem;
    }
    .btn { display: inline-block; padding: 0.85rem 2.4rem; font-family: 'Jost', sans-serif; font-size: 0.7rem; font-weight: 400; letter-spacing: 0.22em; text-transform: uppercase; text-decoration: none; border: 1.5px solid var(--brown-dark); color: var(--brown-dark); background: transparent; cursor: pointer; transition: background 0.25s, color 0.25s; }
    .btn:hover { background: var(--brown-dark); color: var(--sage); }

    footer { padding: 2rem 5vw; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(86,56,12,0.15); }
    .footer-logo { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--brown); opacity: 0.6; }
    .footer-copy { font-size: 0.7rem; color: var(--dark); opacity: 0.35; letter-spacing: 0.08em; }

    @media (max-width: 800px) {
      footer { flex-direction: column; gap: 0.8rem; text-align: center; }
    }
  </style>
</head>
<body>

  <nav>
    <a href="/" class="nav-logo" aria-label="Adrianne Reid Garden Design - Home">
      <span class="nav-logo-mark">ar</span>
      <span class="nav-logo-name">adrianne reid</span>
      <span class="nav-logo-sub">Garden Design</span>
    </a>
  </nav>

  <div class="thank-you">
    <div class="thank-you-monogram">ar</div>
    <h1 class="thank-you-title">Thank you for getting in touch</h1>
    <p class="thank-you-text">
      I've received your enquiry and will be in touch within two working days. I look forward to hearing more about your garden.
    </p>
    <a href="/" class="btn">Back to Home</a>
  </div>

  <footer>
    <span class="footer-logo">ar</span>
    <span class="footer-copy">© 2026 Adrianne Reid Gardens Limited · Wellington, NZ</span>
  </footer>

</body>
</html>
